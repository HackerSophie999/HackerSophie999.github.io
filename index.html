<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerSophie999</title>
    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 24px;
            background: linear-gradient(
                135deg,
                rgb(194, 255, 241),
                rgb(221, 182, 255)
            );
            font-family: Arial, sans-serif;
            color: #29243a;
        }

        h1 {
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-align: center;
            margin: 20px 0 40px;
            letter-spacing: -1px;
        }

        .cardGrid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            display: block;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            font-family: Arial, sans-serif;
            text-decoration: none;
            color: #29243a;
            box-shadow: 0 8px 24px rgba(60, 40, 90, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card img {
            display: block;
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
        }

        .card h2 {
            margin: 18px 0 8px;
            font-size: 1.3rem;
        }

        .card p {
            margin: 0 0 8px;
            color: #686174;
            line-height: 1.5;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(60, 40, 90, 0.2);
        }

        .card:focus-visible {
            outline: 3px solid #7652c7;
            outline-offset: 4px;
        }

        @media (max-width: 750px) {
            .cardGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 24px 16px;
            }

            .cardGrid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>
    <h1>
        Welcome to the portal
    </h1>
    <div class = "cardGrid">
        <a href="MadLibs/index.html" class="card">
            <img src="Media/storyCreator.png" alt="Story Generator">
            <h2>Story Generator</h2>
            <p>Create your own random stories.</p>
        </a>
        <a href="GuessTheNumber/index.html" class="card">
            <img src="Media/questionMark.avif" alt="Question Mark">
            <h2>Guess the number</h2>
            <p>Guess a random number from 1 to 100</p>
        </a>
    </div>
</body>
</html>
